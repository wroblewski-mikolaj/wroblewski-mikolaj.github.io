<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeah Buddy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .player {
            width: min(90vw, 700px);
            text-align: center;
        }

        .player img {
            display: block;
            width: 100%;
            height: auto;
        }

        #playButton {
            position: relative;
            width: 90px;
            height: 70px;
            margin-top: 24px;
            padding: 0;
            border: 2px solid white;
            border-radius: 12px;
            background: black;
            cursor: pointer;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: translate(-40%, -50%);
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-left: 28px solid white;
            pointer-events: none;
        }

        #playButton:active {
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <main class="player">
        <img src="ronnie.gif" alt="Ronnie Coleman">

        <button id="playButton" type="button" aria-label="Play sound">
            <span class="play-icon"></span>
        </button>
    </main>

    <audio id="audio" preload="auto">
        <source src="yeah-buddy.mp3" type="audio/mpeg">
    </audio>

    <script>
        const button = document.getElementById("playButton");
        const audio = document.getElementById("audio");

        button.addEventListener("click", function () {
            audio.currentTime = 0;
            audio.play();
        });
    </script>
</body>
</html>
