<body>
    <main class="player">
        <img src="ronnie.gif" alt="Ronnie Coleman">

        <button id="playButton" type="button" aria-label="Play sound">
            <span class="play-icon"></span>
        </button>
    </main>

    <audio id="audio" preload="auto">
        <source src="yeah-buddy.mp3" type="audio/mpeg">
    </audio>

    <script>
        const button = document.getElementById("playButton");
        const audio = document.getElementById("audio");

        button.addEventListener("click", function () {
            audio.currentTime = 0;
            audio.play();
        });
    </script>
</body>
